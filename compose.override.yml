# Forge-specific overrides for Mission Control.
# - Joins the existing "net-work" docker network so it can reach openclaw-work:18789
# - Binds host ports only on the Tailnet IP (100.97.16.19), no public exposure
# - Renames the project containers so they read clearly in `docker ps`
# - Adds restart: unless-stopped

services:
  db:
    container_name: mission-control-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5532}:5432"
    networks:
      - default

  redis:
    container_name: mission-control-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6479}:6379"
    networks:
      - default

  backend:
    container_name: mission-control-backend
    restart: unless-stopped
    image: openclaw-mission-control-backend:local
    build: !reset null
    env_file:
      - path: C:/Users/anvil/.secrets/notion.env
        required: false
      - path: C:/Users/anvil/.secrets/langfuse.env
        required: false
      - path: C:/Users/anvil/.secrets/freshrss.env
        required: false
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-8100}:8000"
    volumes:
      - bot_events:/var/lib/bot-events:ro
      - metric_data:/var/lib/metrics
    networks:
      - default
      - net-work
      - rss-net
      - langfuse-net

  frontend:
    container_name: mission-control-frontend
    restart: unless-stopped
    image: openclaw-mission-control-frontend:local
    build: !reset null
    env_file: !reset []
    develop: !reset null
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-3100}:3000"
    networks:
      - default

  webhook-worker:
    container_name: mission-control-worker
    restart: unless-stopped
    image: openclaw-mission-control-backend:local
    build: !reset null
    env_file: !reset []
    networks:
      - default
      - net-work

volumes:
  bot_events:
    external: true
    name: bot_events
  metric_data:
    name: metric_data

networks:
  default:
    name: mission-control_default
  net-work:
    external: true
  rss-net:
    external: true
  langfuse-net:
    external: true
    name: langfuse_langfuse-net
